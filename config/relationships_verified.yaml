important_notes:
- This replaces the previous inferred relationships.yaml. Every relationship below is a VERIFIED constraint
  from the live SIT database, not inferred from naming conventions.
- The earlier DDL zip exports did not include constraints - this query result data is the authoritative
  source and should be treated as ground truth.
- '8 tables outside the P_* Provider set are referenced via FK: [''G_ATTACH_TB'', ''G_CMN_ENTY_TB'', ''G_COTS_LTR_REQ_TB'',
  ''G_E_ADR_TB'', ''G_NOTE_SET_TB'', ''G_PHONE_TB'', ''R_PROV_NW_TB'', ''T_CARR_TB'']. These belong to
  other schemas (Contact Management G_*, Reference R_*, Third-party T_*) and are not part of this Provider
  DDL export.'
