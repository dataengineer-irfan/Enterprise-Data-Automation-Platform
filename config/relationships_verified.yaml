insert_sequence_active_provider:
- step: 1
  action: Insert P_DTL_TB
  captures: P_SYS_ID (generated)
- step: 2
  action: Insert P_TY_TB using P_SYS_ID
  purpose: Provider Type
- step: 3
  action: Insert P_TXNMY_TB using P_SYS_ID
  purpose: Taxonomy
- step: 4
  action: Insert P_SPECL_TB using P_SYS_ID
  purpose: Specialty
- step: 5
  action: Insert P_LIC_CERT_TB using P_SYS_ID
  purpose: License Certification
- step: 6
  action: Insert P_ENROL_STAT_TB using P_SYS_ID
  purpose: Enrollment Status - set Active
- step: 7
  action: Insert P_ALT_ID_TB using P_SYS_ID with alt-id-type = NPI
  purpose: NPI stored as alternate ID row
business_rules:
- rule_id: BR-REL-001
  description: A provider is not fully Active without rows in P_TY_TB, P_TXNMY_TB, P_SPECL_TB, P_LIC_CERT_TB,
    and an Active row in P_ENROL_STAT_TB.
- rule_id: BR-REL-002
  description: All FK columns must resolve to an existing parent row before insert - verified constraints
    will reject orphaned child rows at the database level.
- rule_id: BR-REL-003
  description: P_AFFL_TB self-references P_DTL_TB twice (P_GRP_SYS_ID and P_MBR_SYS_ID) - both must be
    valid existing P_SYS_ID values.
