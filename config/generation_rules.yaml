# NPI               -> mapped above as p_alt_id_npi
# PROVIDER_TYPE     -> mapped above as p_ty_cd
# SPECIALTY_CODE    -> mapped above as p_specl_cd
# LANGUAGE_CODE     -> mapped above as p_lang_cd
